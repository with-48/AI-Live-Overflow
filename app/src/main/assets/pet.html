<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小云朵</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:transparent; overflow:hidden; }
  #pet { width:100%; height:100%; display:block; }
  .bob { animation: bob 4.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .rain { animation: drip 2s linear infinite; }
  @keyframes drip {
    0% { opacity:0; transform: translateY(-8px); }
    30% { opacity:.85; }
    100% { opacity:0; transform: translateY(28px); }
  }
  #blushL, #blushR { transition: opacity .3s ease; }
</style>
</head>
<body>
<svg id="pet" viewBox="0 0 180 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f8fd"/>
    </linearGradient>
    <linearGradient id="rainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcdaf2"/>
      <stop offset="1" stop-color="#93c2e8"/>
    </linearGradient>
  </defs>

  <g class="bob">
    <!-- 云体：胶囊底 + 三个圆鼓包 -->
    <rect id="cloud" x="34" y="78" width="112" height="54" rx="27" fill="url(#cloudGrad)"/>
    <circle cx="60" cy="78" r="25" fill="#ffffff"/>
    <circle cx="90" cy="68" r="32" fill="#ffffff"/>
    <circle cx="120" cy="78" r="25" fill="#ffffff"/>
    <!-- 底部柔阴影 -->
    <ellipse cx="90" cy="130" rx="58" ry="9" fill="#dcebf8" opacity="0.55"/>
    <!-- 顶部高光 -->
    <ellipse cx="72" cy="70" rx="24" ry="13" fill="#ffffff" opacity="0.7"/>

    <!-- 腮红 -->
    <ellipse id="blushL" cx="62" cy="112" rx="10" ry="6" fill="#ffc3d2" opacity="0.75"/>
    <ellipse id="blushR" cx="118" cy="112" rx="10" ry="6" fill="#ffc3d2" opacity="0.75"/>

    <!-- 表情 normal -->
    <g id="exprNormal">
      <circle cx="78" cy="100" r="5" fill="#3b4a5b"/>
      <circle cx="104" cy="100" r="5" fill="#3b4a5b"/>
      <circle cx="79.8" cy="98.2" r="1.7" fill="#ffffff"/>
      <circle cx="105.8" cy="98.2" r="1.7" fill="#ffffff"/>
      <path d="M86 114 Q91 119 96 114" fill="none" stroke="#3b4a5b" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- 表情 happy -->
    <g id="exprHappy" style="display:none">
      <path d="M72 99 Q78 93 84 99" fill="none" stroke="#3b4a5b" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M96 99 Q102 93 108 99" fill="none" stroke="#3b4a5b" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M83 113 Q90 123 97 113 Z" fill="#3b4a5b" stroke-linejoin="round"/>
    </g>

    <!-- 表情 shy -->
    <g id="exprShy" style="display:none">
      <path d="M73 100 L69 104 L73 104 Z" fill="#3b4a5b"/>
      <path d="M107 100 L111 104 L107 104 Z" fill="#3b4a5b"/>
      <path d="M86 116 Q90 118 94 116" fill="none" stroke="#3b4a5b" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- 表情 angry -->
    <g id="exprAngry" style="display:none">
      <line x1="70" y1="90" x2="84" y2="96" stroke="#3b4a5b" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="110" y1="90" x2="96" y2="96" stroke="#3b4a5b" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="78" cy="101" r="4.6" fill="#3b4a5b"/>
      <circle cx="104" cy="101" r="4.6" fill="#3b4a5b"/>
      <path d="M86 121 Q91 116 96 121" fill="none" stroke="#3b4a5b" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- 表情 blink -->
    <g id="exprBlink" style="display:none">
      <path d="M73 100 Q78 97 83 100" fill="none" stroke="#3b4a5b" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M97 100 Q102 97 107 100" fill="none" stroke="#3b4a5b" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M86 114 Q91 119 96 114" fill="none" stroke="#3b4a5b" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- 雨滴 -->
    <g id="drops">
      <line class="rain" x1="56" y1="142" x2="56" y2="153" stroke="url(#rainGrad)" stroke-width="3.6" stroke-linecap="round"/>
      <line class="rain" x1="90" y1="148" x2="90" y2="159" stroke="url(#rainGrad)" stroke-width="3.6" stroke-linecap="round"/>
      <line class="rain" x1="124" y1="142" x2="124" y2="153" stroke="url(#rainGrad)" stroke-width="3.6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
<script>
(function () {
  var groups = {
    normal: document.getElementById('exprNormal'),
    happy: document.getElementById('exprHappy'),
    shy: document.getElementById('exprShy'),
    angry: document.getElementById('exprAngry'),
    blink: document.getElementById('exprBlink')
  };
  var blushes = [document.getElementById('blushL'), document.getElementById('blushR')];
  var drops = document.getElementById('drops');
  var pet = document.getElementById('pet');
  var timer = null;

  function log(m) { try { if (window.petHost) window.petHost.log(m); } catch (e) {} }

  function show(name) {
    for (var k in groups) { groups[k].style.display = (k === name) ? '' : 'none'; }
  }

  function flash(name, dur) {
    show(name);
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () { show('normal'); }, dur || 700);
  }

  window.petEngine = {
    onTap: function () {
      log('tap');
      pet.style.transform = 'scale(1.06)';
      setTimeout(function () { pet.style.transform = 'scale(1)'; }, 140);
      flash('happy', 500);
    },
    onDoubleTap: function () {
      log('double');
      flash('blink', 600);
      for (var i = 0; i < blushes.length; i++) { blushes[i].setAttribute('opacity', '0.95'); }
      setTimeout(function () { for (var j = 0; j < blushes.length; j++) { blushes[j].setAttribute('opacity', '0.75'); } }, 600);
    },
    onLongPress: function () {
      log('long');
      flash('angry', 900);
      drops.style.display = 'none';
      setTimeout(function () { drops.style.display = ''; }, 900);
    },
    setMood: function (m) {
      log('mood:' + m);
      if (groups[m]) { flash(m, 1200); }
    }
  };
})();
</script>
</body>
</html>
